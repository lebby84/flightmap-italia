name: Nightly Flight Scan (AirLabs)

on:
  schedule:
    - cron: '0 2 * * *' # Ogni notte alle 02:00 UTC (03:00 ora italiana solare)
  workflow_dispatch:     # Permette l'avvio manuale con un clic da GitHub Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui scansione voli AirLabs
        env:
          AIRLABS_KEY: ${{ secrets.AIRLABS_KEY }}
        run: python scan_flights.py

      - name: Salva routes.json e quota_state.json nel repository
        run: |
          git config user.name "FlightMap Bot"
          git config user.email "bot@users.noreply.github.com"
          git add routes.json quota_state.json
          git diff --staged --quiet || git commit -m "Aggiornamento notturno rotte AirLabs"
          git push
