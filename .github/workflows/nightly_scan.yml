name: Nightly Flight Scan (AirLabs + Ryanair)

on:
  schedule:
    - cron: '0 2 * * *' # Ogni notte alle 02:00 UTC (03:00 ora italiana solare)
  workflow_dispatch:
    inputs:
      airport:
        description: 'Cosa sincronizzare? (RYANAIR = tutta la flotta gratis, AUTO = pianificazione automatica)'
        required: true
        default: 'RYANAIR'
        type: choice
        options:
          - RYANAIR
          - BLQ
          - VRN
          - BGY
          - FLR
          - TSF
          - LIN
          - MXP
          - VCE
          - AUTO
          - ALL
      force:
        description: 'Forza aggiornamento anche se gia scansionato di recente (vale per AUTO)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui scansione voli
        env:
          AIRLABS_KEY: ${{ secrets.AIRLABS_KEY }}
          TARGET_AIRPORT: ${{ github.event.inputs.airport || 'AUTO' }}
          FORCE_RESCAN: ${{ github.event.inputs.force || 'false' }}
        run: python scan_flights.py

      - name: Salva routes.json e quota_state.json nel repository
        run: |
          git config user.name "FlightMap Bot"
          git config user.email "bot@users.noreply.github.com"
          git add routes.json quota_state.json
          git diff --staged --quiet || git commit -m "Aggiornamento rotte (${{ github.event.inputs.airport || 'AUTO' }})"
          git push
