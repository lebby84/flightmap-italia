<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlightMap Italia — Rotte Dirette e Giorni di Volo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100%; width: 100%; z-index: 1; background: #0f172a; }
    .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(92%) contrast(88%) saturate(70%); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }
    @keyframes dashMove {
      to { stroke-dashoffset: -36; }
    }
    .route-animated {
      animation: dashMove 1.1s linear infinite;
    }
    .leaflet-tooltip.ap-tooltip {
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .leaflet-tooltip-top.ap-tooltip::before { border-top-color: rgba(15, 23, 42, 0.92); }
    .drop-overlay {
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 select-none">

  <!-- Drag & Drop Overlay -->
  <div id="dropOverlay" class="drop-overlay fixed inset-0 z-50 bg-sky-900/80 backdrop-blur-sm hidden flex items-center justify-center border-4 border-dashed border-sky-300 m-4 rounded-2xl">
    <div class="text-center text-white">
      <div class="text-4xl mb-2">📂</div>
      <div class="text-xl font-bold">Rilascia qui il file routes.json</div>
      <div class="text-sm text-sky-200 mt-1">I voli e lo stato quota verranno caricati istantaneamente</div>
    </div>
  </div>

  <!-- Mobile Sidebar Toggle -->
  <button id="mobileMenuBtn" class="md:hidden fixed top-3 left-3 z-30 bg-slate-900/95 border border-slate-700 text-white px-3 py-2 rounded-xl shadow-lg flex items-center gap-2 text-sm font-semibold">
    <span>☰</span> <span>Rotte</span>
  </button>

  <!-- Main Layout -->
  <div class="flex h-full w-full relative">

    <!-- Left Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-full max-w-[390px] bg-slate-900/95 backdrop-blur-md border-r border-slate-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 shadow-2xl">

      <!-- Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-lg shadow-md shrink-0">✈️</div>
          <div class="min-w-0">
            <h1 class="font-bold text-base leading-tight text-white truncate">FlightMap Italia</h1>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span id="dataModeBadge" class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/30">DEMO</span>
              <span id="lastUpdateText" class="text-[11px] text-slate-400 truncate">Dati dimostrativi</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <label for="jsonFileInput" title="Carica routes.json" class="cursor-pointer px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-slate-200 transition">
            Carica JSON
          </label>
          <input id="jsonFileInput" type="file" accept=".json,application/json" class="hidden" />
          <button id="closeMobileBtn" class="md:hidden p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white">✕</button>
        </div>
      </div>

      <!-- Quota Status Banner -->
      <div id="quotaBanner" class="hidden px-4 py-2 border-b border-slate-800 text-xs"></div>

      <!-- Quick Base Airports Bar -->
      <div class="px-4 pt-3 pb-2 border-b border-slate-800/80">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">I tuoi 8 aeroporti</span>
          <span id="routeCountBadge" class="text-[11px] font-semibold text-sky-400">0 rotte</span>
        </div>
        <div id="baseAirportPills" class="grid grid-cols-4 gap-1.5"></div>
      </div>

      <!-- Controls: Mode + Search + Filters -->
      <div class="p-4 space-y-3 border-b border-slate-800">
        <!-- Direction Mode -->
        <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
          <button id="modeFromBtn" class="py-1.5 text-xs font-semibold rounded-lg transition bg-sky-600 text-white shadow">
            🛫 Parto da
          </button>
          <button id="modeToBtn" class="py-1.5 text-xs font-semibold rounded-lg transition text-slate-400 hover:text-white">
            🛬 Arrivo a
          </button>
        </div>

        <!-- Autocomplete Airport Search -->
        <div class="relative">
          <input id="airportSearch" type="text" autocomplete="off"
                 placeholder="Cerca aeroporto (es. BLQ, Stoccolma, ARN)..."
                 class="w-full bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 pr-8" />
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">✕</button>
          <div id="searchDropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-60 overflow-y-auto custom-scroll z-40"></div>
        </div>

        <!-- Airline Filter & Sort -->
        <div class="grid grid-cols-2 gap-2">
          <select id="airlineFilter" class="bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none rounded-xl px-2.5 py-1.5 text-xs text-slate-200">
            <option value="">Tutte le compagnie</option>
          </select>
          <select id="sortSelect" class="bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none rounded-xl px-2.5 py-1.5 text-xs text-slate-200">
            <option value="city">Ordina: Città (A-Z)</option>
            <option value="freq">Ordina: Frequenza</option>
            <option value="airlines">Ordina: N° compagnie</option>
          </select>
        </div>

        <!-- Days of Week Toggle -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-medium text-slate-400">Filtra per giorno di volo</span>
            <button id="resetDaysBtn" class="hidden text-[11px] text-sky-400 hover:underline">Tutti i giorni</button>
          </div>
          <div id="dayFilterButtons" class="grid grid-cols-7 gap-1"></div>
        </div>
      </div>

      <!-- Selected Airport Header -->
      <div id="activeAirportHeader" class="px-4 py-2.5 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between">
        <div class="min-w-0">
          <div class="text-xs text-slate-400" id="activeDirectionLabel">Voli diretti in partenza da</div>
          <div class="font-bold text-sm text-white truncate" id="activeAirportTitle">Bologna (BLQ)</div>
        </div>
        <button id="resetFiltersBtn" class="hidden text-xs px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 shrink-0">Reset filtri</button>
      </div>

      <!-- Routes List -->
      <div id="routesList" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2"></div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 relative h-full w-full">
      <div id="map"></div>

      <!-- Floating Map Controls (Top Right) -->
      <div class="fixed md:absolute top-3 right-3 z-20 flex items-center gap-2">
        <button id="centerMapBtn" title="Centra mappa sulle rotte" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-slate-100 px-3 py-2 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-1.5 backdrop-blur">
          <span>🎯</span> <span class="hidden sm:inline">Centra</span>
        </button>
        <button id="themeToggleBtn" title="Cambia tema mappa Chiaro/Scuro" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-slate-100 px-3 py-2 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-1.5 backdrop-blur">
          <span id="themeIcon">☀️</span> <span id="themeLabel" class="hidden sm:inline">Chiaro</span>
        </button>
        <button id="quotaInfoBtn" title="Stato quota API" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-700 text-slate-100 px-3 py-2 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-1.5 backdrop-blur">
          <span>📊</span> <span id="quotaShortText">Demo</span>
        </button>
      </div>

      <!-- Route Detail Panel (Floating Bottom Right) -->
      <div id="routeDetailCard" class="hidden fixed md:absolute bottom-4 right-4 left-4 md:left-auto md:w-[410px] z-20 bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-800 flex items-start justify-between gap-3 bg-gradient-to-r from-slate-900 to-slate-800/70">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="detailFromIata" class="px-2 py-0.5 rounded-md bg-sky-500/20 text-sky-300 font-mono font-bold text-sm border border-sky-500/30">BLQ</span>
              <span class="text-slate-400">➔</span>
              <span id="detailToIata" class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 font-mono font-bold text-sm border border-emerald-500/30">ARN</span>
              <span id="detailDistance" class="text-xs text-slate-400 ml-1">• 1.650 km</span>
            </div>
            <div id="detailCities" class="text-sm font-semibold text-white mt-1.5 truncate">Bologna → Stoccolma</div>
            <div id="detailAirportsSub" class="text-[11px] text-slate-400 truncate"></div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="reverseRouteBtn" title="Mostra volo di ritorno" class="px-2.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold transition flex items-center gap-1">
              ⇄ Inverti
            </button>
            <button id="closeDetailBtn" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs">✕</button>
          </div>
        </div>
        <div id="detailAirlinesList" class="p-4 max-h-[42vh] overflow-y-auto custom-scroll space-y-3"></div>
      </div>

      <!-- Quota Modal -->
      <div id="quotaModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
            <h2 class="font-bold text-white text-base">Stato Cache e Quota API</h2>
            <button id="closeQuotaModal" class="text-slate-400 hover:text-white">✕</button>
          </div>
          <div id="quotaModalBody" class="p-5 text-sm text-slate-300 space-y-3"></div>
        </div>
      </div>
    </main>
  </div>

  const routes = [];

      from: b,
      to: a,
      airlines: airlines.map(al => ({ ...al, sample_times: al.sample_times.map(t => shiftTime(t, 2)) }))
    });
  }

  return { is_demo: true, generated_at: null, quota_status: null, airports, routes };

function shiftTime(hhmm, hours) {
  const [h, m] = hhmm.split(":").map(Number);
  return `${String((h + hours) % 24).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function buildCurvedArc(fromAp, toAp, steps = 36) {
  const lat1 = fromAp.lat, lon1 = fromAp.lon, lat2 = toAp.lat, lon2 = toAp.lon;
  const midLat = (lat1 + lat2) / 2, midLon = (lon1 + lon2) / 2;
  const dx = lon2 - lon1, dy = lat2 - lat1;
  const curve = Math.min(Math.hypot(dx, dy) * 0.16, 4.5);
  const ctrlLat = midLat + (dx >= 0 ? curve : -curve) * 0.35 + curve * 0.45;
  const ctrlLon = midLon - (dy * 0.12);
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, inv = 1 - t;
    pts.push([
      inv * inv * lat1 + 2 * inv * t * ctrlLat + t * t * lat2,
      inv * inv * lon1 + 2 * inv * t * ctrlLon + t * t * lon2
    ]);
  }
  return pts;
}

function getMatchingRoutes() {
  const ap = state.selectedAirport;
  let list = dataset.routes.filter(r => state.mode === "from" ? r.from === ap : r.to === ap);
  list = list.map(r => {
    const filteredAirlines = r.airlines.filter(al => {
      if (state.airlineFilter && al.name !== state.airlineFilter) return false;
      if (state.dayFilters.size > 0 && !al.days.some(d => state.dayFilters.has(d))) return false;
      return true;
    });
    return { ...r, airlines: filteredAirlines };
  }).filter(r => r.airlines.length > 0);

  list.forEach(r => {
    const allDays = new Set();
    r.airlines.forEach(al => al.days.forEach(d => allDays.add(d)));
    r._daysCount = allDays.size;
    r._allDays = [...allDays].sort((a, b) => a - b);
    const otherCode = state.mode === "from" ? r.to : r.from;
    r._otherAp = dataset.airports[otherCode] || { iata: otherCode, city: otherCode, name: otherCode, country: "" };
  });

  if (state.sortBy === "city") list.sort((a, b) => a._otherAp.city.localeCompare(b._otherAp.city, "it"));
  else if (state.sortBy === "freq") list.sort((a, b) => b._daysCount - a._daysCount || a._otherAp.city.localeCompare(b._otherAp.city, "it"));
  else if (state.sortBy === "airlines") list.sort((a, b) => b.airlines.length - a.airlines.length || b._daysCount - a._daysCount);
  return list;
}

function getAvailableAirlinesForAirport() {
  const ap = state.selectedAirport, set = new Set();
  dataset.routes.forEach(r => {
    if ((state.mode === "from" && r.from === ap) || (state.mode === "to" && r.to === ap)) {
      r.airlines.forEach(al => set.add(al.name));
    }
  });
  return [...set].sort((a, b) => a.localeCompare(b, "it"));
}

function renderMap(routes, fitBounds = false) {
  routesLayer.clearLayers();
  markersLayer.clearLayers();
  const activeAp = dataset.airports[state.selectedAirport], boundsPoints = [];
  if (activeAp && activeAp.lat != null) boundsPoints.push([activeAp.lat, activeAp.lon]);

  routes.forEach(r => {
    const fromAp = dataset.airports[r.from], toAp = dataset.airports[r.to];
    if (!fromAp || !toAp || fromAp.lat == null || toAp.lat == null) return;
    const isSel = state.selectedRouteKey === `${r.from}->${r.to}`;
    const poly = L.polyline(buildCurvedArc(fromAp, toAp), {
      color: isSel ? "#38bdf8" : (state.mode === "from" ? "#0ea5e9" : "#10b981"),
      weight: isSel ? 3.5 : 1.7,
      opacity: isSel ? 1 : (state.selectedRouteKey ? 0.25 : 0.62),
      dashArray: isSel ? "8 10" : null,
      className: isSel ? "route-animated" : ""
    });
    poly.on("click", () => selectRoute(r));
    poly.on("mouseover", function() { if (!isSel) this.setStyle({ weight: 3, opacity: 0.95 }); });
    poly.on("mouseout", function() { if (!isSel) this.setStyle({ weight: 1.7, opacity: state.selectedRouteKey ? 0.25 : 0.62 }); });
    poly.addTo(routesLayer);
    const otherAp = state.mode === "from" ? toAp : fromAp;
    boundsPoints.push([otherAp.lat, otherAp.lon]);
  });

  const connectedCodes = new Set();
  routes.forEach(r => connectedCodes.add(state.mode === "from" ? r.to : r.from));
  const codesToRender = new Set([...BASE_ORDER, ...connectedCodes, state.selectedAirport]);

  codesToRender.forEach(code => {
    const ap = dataset.airports[code];
    if (!ap || ap.lat == null) return;
    const isSelected = code === state.selectedAirport;
    const isBase = Boolean(ap.is_base || BASE_ORDER.includes(code));
    const isConnected = connectedCodes.has(code);
    const marker = L.circleMarker([ap.lat, ap.lon], {
      radius: isSelected ? 9 : (isBase ? 6.5 : 5.5),
      color: isSelected ? "#ffffff" : (isBase ? "#fbbf24" : "#38bdf8"),
      weight: isSelected ? 3 : 2,
      fillColor: isSelected ? "#0284c7" : (isBase ? "#f59e0b" : (isConnected ? "#0ea5e9" : "#475569")),
      fillOpacity: isSelected ? 1 : (isConnected || isBase ? 0.92 : 0.45)
    });
    marker.bindTooltip(`${ap.iata} • ${ap.city}`, { direction: "top", offset: [0, -8], className: "ap-tooltip" });
    marker.on("click", () => {
      if (isSelected) return;
      if (isConnected) {
        const match = routes.find(r => (state.mode === "from" ? r.to === code : r.from === code));
        if (match) { selectRoute(match); return; }
      }
      selectAirport(code, true);
    });
    marker.addTo(markersLayer);
  });

  if (fitBounds && boundsPoints.length > 1) map.fitBounds(boundsPoints, { padding: [55, 55], maxZoom: 6 });
  else if (fitBounds && boundsPoints.length === 1) map.setView(boundsPoints[0], 6);
}

function renderRouteDetail() {
  const card = document.getElementById("routeDetailCard");
  if (!state.selectedRouteKey) { card.classList.add("hidden"); return; }
  const [fromCode, toCode] = state.selectedRouteKey.split("->");
  const route = getMatchingRoutes().find(r => r.from === fromCode && r.to === toCode)
    || dataset.routes.find(r => r.from === fromCode && r.to === toCode);
  if (!route) { card.classList.add("hidden"); return; }

  const fromAp = dataset.airports[route.from] || { iata: route.from, city: route.from, name: route.from };
  const toAp = dataset.airports[route.to] || { iata: route.to, city: route.to, name: route.to };
  document.getElementById("detailFromIata").textContent = fromAp.iata;
  document.getElementById("detailToIata").textContent = toAp.iata;
  document.getElementById("detailCities").textContent = `${fromAp.city} → ${toAp.city}`;
  document.getElementById("detailAirportsSub").textContent = `${fromAp.name} → ${toAp.name}`;
  document.getElementById("detailDistance").textContent = (fromAp.lat != null && toAp.lat != null)
    ? `• ${haversineKm(fromAp.lat, fromAp.lon, toAp.lat, toAp.lon).toLocaleString("it-IT")} km` : "";

  const list = document.getElementById("detailAirlinesList");
  list.innerHTML = "";
  route.airlines.forEach(al => {
    const badges = [1,2,3,4,5,6,7].map(d => `<span class="px-2 py-1 rounded-md text-[11px] font-bold text-center ${al.days.includes(d) ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40" : "bg-slate-950 text-slate-600 border border-slate-800/80"}">${DAY_LABEL[d]}</span>`).join("");
    const timesHtml = (al.sample_times && al.sample_times.length)
      ? `<div class="flex flex-wrap gap-1.5 mt-2">${al.sample_times.map(t => `<span class="px-2 py-0.5 rounded bg-slate-950 border border-slate-700 text-[11px] font-mono text-slate-300">🕒 ${t}</span>`).join("")}</div>` : "";
    const row = document.createElement("div");
    row.className = "p-3 rounded-xl bg-slate-800/60 border border-slate-700/70";
    row.innerHTML = `
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-2 min-w-0">
          ${al.iata ? `<span class="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-mono text-xs font-bold">${al.iata}</span>` : ""}
          <span class="font-semibold text-sm text-white truncate">${al.name}</span>
        </div>
        <span class="text-xs text-slate-400 shrink-0">${al.days.length} gg/sett</span>
      </div>
      <div class="grid grid-cols-7 gap-1">${badges}</div>
      ${timesHtml}`;
    list.appendChild(row);
  });
  card.classList.remove("hidden");
}

function renderAll(fitBounds = false) {
  renderBasePills();
  renderDayFilters();
  renderAirlineDropdown();
  renderQuotaStatus();
  const routes = getMatchingRoutes();
  renderRoutesList(routes);
  renderMap(routes, fitBounds);
  renderRouteDetail();
}

function selectAirport(code, fitBounds = true) {
  if (!dataset.airports[code]) return;
  state.selectedAirport = code;
  state.selectedRouteKey = null;
  state.airlineFilter = "";
  renderAll(fitBounds);
}

function selectRoute(route) {
  state.selectedRouteKey = `${route.from}->${route.to}`;
  renderAll(false);
  if (window.innerWidth < 768) document.getElementById("sidebar").classList.add("-translate-x-full");
}

document.getElementById("themeToggleBtn").onclick = () => {
  state.darkTheme = !state.darkTheme;
  if (state.darkTheme) { map.removeLayer(tileLight); tileDark.addTo(map); document.getElementById("themeIcon").textContent = "☀️"; document.getElementById("themeLabel").textContent = "Chiaro"; }
  else { map.removeLayer(tileDark); tileLight.addTo(map); document.getElementById("themeIcon").textContent = "🌙"; document.getElementById("themeLabel").textContent = "Scuro"; }
};
document.getElementById("mobileMenuBtn").onclick = () => document.getElementById("sidebar").classList.remove("-translate-x-full");
document.getElementById("closeMobileBtn").onclick = () => document.getElementById("sidebar").classList.add("-translate-x-full");

const searchInput = document.getElementById("airportSearch"), searchDropdown = document.getElementById("searchDropdown"), clearSearchBtn = document.getElementById("clearSearchBtn");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  clearSearchBtn.classList.toggle("hidden", !q);
  if (!q) { searchDropdown.classList.add("hidden"); return; }
  const matches = Object.values(dataset.airports)
    .filter(ap => ap.iata.toLowerCase().includes(q) || (ap.city || "").toLowerCase().includes(q) || (ap.name || "").toLowerCase().includes(q))
    .sort((a, b) => (b.is_base ? 1 : 0) - (a.is_base ? 1 : 0) || a.city.localeCompare(b.city, "it")).slice(0, 14);
  searchDropdown.innerHTML = matches.length ? matches.map(ap => `
    <button data-iata="${ap.iata}" class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center justify-between gap-2 border-b border-slate-800/60 last:border-0">
      <div class="text-xs font-semibold text-white truncate">${ap.city} <span class="text-slate-400 font-normal">• ${ap.name}</span></div>
      <span class="font-mono text-xs font-bold px-1.5 py-0.5 rounded ${ap.is_base ? "bg-amber-500/20 text-amber-300" : "bg-sky-500/20 text-sky-300"}">${ap.iata}</span>
    </button>`).join("") : `<div class="p-3 text-xs text-slate-400">Nessun aeroporto trovato</div>`;
  searchDropdown.querySelectorAll("button[data-iata]").forEach(btn => {
    btn.onclick = () => { selectAirport(btn.dataset.iata, true); searchInput.value = ""; clearSearchBtn.classList.add("hidden"); searchDropdown.classList.add("hidden"); };
  });
  searchDropdown.classList.remove("hidden");
});
clearSearchBtn.onclick = () => { searchInput.value = ""; clearSearchBtn.classList.add("hidden"); searchDropdown.classList.add("hidden"); };
document.addEventListener("click", e => { if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) searchDropdown.classList.add("hidden"); });

document.getElementById("quotaInfoBtn").onclick = () => {
  const body = document.getElementById("quotaModalBody");
  if (dataset.is_demo) {
    body.innerHTML = `<p>Stai visualizzando la <strong>Modalità DEMO</strong> perché non è ancora presente un file <code class="text-sky-300">routes.json</code> reale.</p><p class="text-xs text-slate-400">Appena GitHub Actions completerà la prima scansione AirLabs (o se trascini qui un file <code>routes.json</code>), la mappa passerà automaticamente ai dati reali.</p>`;
  } else {
    const q = dataset.quota_status || {}, scans = q.last_scan_by_airport || {};
    const rows = BASE_ORDER.map(code => {
      const dt = scans[code] ? new Date(scans[code]).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "In attesa";
      return `<div class="flex justify-between py-1 border-b border-slate-800 text-xs"><span class="font-mono font-bold text-amber-300">${code}</span><span class="text-slate-300">${dt}</span></div>`;
    }).join("");
    body.innerHTML = `
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><div class="text-slate-400">Chiamate usate (${q.cycle || "-"})</div><div class="text-lg font-bold text-white mt-0.5">${q.units_used ?? 0} / ${q.units_limit ?? "?"}</div></div>
        <div class="p-3 rounded-xl bg-slate-950 border border-slate-800"><div class="text-slate-400">Stato Blocco</div><div class="text-lg font-bold mt-0.5 ${q.blocked ? "text-amber-400" : "text-emerald-400"}">${q.blocked ? "In pausa" : "Attivo"}</div></div>
      </div>
      ${q.blocked && q.reason ? `<div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-200 text-xs">${q.reason}</div>` : ""}
      <div><div class="text-xs font-semibold text-slate-400 uppercase mb-1">Ultima scansione per aeroporto</div><div class="bg-slate-950 rounded-xl border border-slate-800 px-3 py-1">${rows}</div></div>`;
  }
  document.getElementById("quotaModal").classList.remove("hidden");
};
document.getElementById("closeQuotaModal").onclick = () => document.getElementById("quotaModal").classList.add("hidden");
document.getElementById("quotaModal").onclick = e => { if (e.target.id === "quotaModal") document.getElementById("quotaModal").classList.add("hidden"); };

function applyLoadedJson(data) {
  if (!data || !data.airports || !Array.isArray(data.routes)) { alert("Il file JSON non sembra avere il formato valido di FlightMap."); return; }
  dataset = { ...data, is_demo: false };
  if (!dataset.airports[state.selectedAirport]) state.selectedAirport = BASE_ORDER.find(c => dataset.airports[c]) || Object.keys(dataset.airports)[0];
  state.selectedRouteKey = null;
  renderAll(true);
}

async function tryAutoLoadJson() {
  try {
    const resp = await fetch("./routes.json?t=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("not found");
    const json = await resp.json();
    if (json && json.routes && json.routes.length > 0) { applyLoadedJson(json); return; }
  } catch (_) {}
  renderAll(true);
}

document.getElementById("jsonFileInput").addEventListener("change", e => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { try { applyLoadedJson(JSON.parse(ev.target.result)); } catch { alert("Impossibile leggere il file JSON selezionato."); } };
  reader.readAsText(file);
  e.target.value = "";
});

const dropOverlay = document.getElementById("dropOverlay");
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; dropOverlay.classList.remove("hidden"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (dragDepth === 0) dropOverlay.classList.add("hidden"); });
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; dropOverlay.classList.add("hidden");
  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { try { applyLoadedJson(JSON.parse(ev.target.result)); } catch { alert("File non valido: trascina routes.json."); } };
  reader.readAsText(file);
});

tryAutoLoadJson();
</script>
</body>
</html>
